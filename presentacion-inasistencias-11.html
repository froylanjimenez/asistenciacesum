<title>Inasistencias 11° — Presentación CESUM 2026</title>

<style>
:root {
  --bg:#0d1117;--card:#161b22;--input:#1c2330;--border:#30363d;
  --blue:#2563eb;--blue-lt:#3b82f6;--blue-glow:#2563eb33;
  --green:#22c55e;--red:#ef4444;--orange:#f97316;
  --yellow:#eab308;--purple:#a855f7;
  --text:#f0f6fc;--text-2:#8b949e;--text-3:#484f58;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text)}

#progress{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--red),var(--orange));width:0;transition:width .4s ease;z-index:1000}
#counter{position:fixed;top:18px;right:22px;font-family:'JetBrains Mono',monospace;font-size:.9rem;color:var(--text-3);z-index:100;letter-spacing:.05em}
.nav-arrow{position:fixed;bottom:28px;z-index:100;background:var(--card);border:1px solid var(--border);color:var(--text-2);font-size:1.4rem;width:52px;height:52px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;user-select:none}
.nav-arrow:hover{background:var(--red);border-color:var(--red);color:#fff}
#prev{left:calc(50% - 62px)}
#next{left:calc(50% + 10px)}
#dots{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:99}
.dot{width:7px;height:7px;border-radius:50%;background:var(--text-3);transition:all .3s;cursor:pointer}
.dot.active{background:var(--red);width:20px;border-radius:3px}

#deck{height:100vh;width:100vw;overflow:hidden;position:relative}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4rem 2rem 5rem;opacity:0;transform:translateX(60px);transition:all .5s cubic-bezier(.4,0,.2,1);pointer-events:none}
.slide.active{opacity:1;transform:translateX(0);pointer-events:all}
.slide.exit{opacity:0;transform:translateX(-60px)}

.slide-inner{width:100%;max-width:980px}
.tag{font-size:.88rem;letter-spacing:3px;text-transform:uppercase;color:var(--red);font-weight:600;margin-bottom:1rem}
.big-title{font-size:clamp(2.2rem,5vw,3.6rem);font-weight:800;line-height:1.15;margin-bottom:1rem}
.big-title .hl{color:var(--red)}
.big-title .hl2{color:var(--orange)}
.subtitle{font-size:clamp(1rem,2vw,1.3rem);color:var(--text-2);line-height:1.7;max-width:740px}

.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:700px){.g2,.g3,.g5{grid-template-columns:1fr 1fr}}
@media(max-width:450px){.g2,.g3,.g5{grid-template-columns:1fr}}

.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.25rem 1.5rem}
.card h3{font-size:1.05rem;font-weight:600;color:var(--text);margin-bottom:.4rem}
.card p{font-size:.9rem;color:var(--text-2);line-height:1.6}
.card.red{border-color:var(--red);background:linear-gradient(135deg,#1f0d0d,var(--card))}
.card.orange{border-color:var(--orange);background:linear-gradient(135deg,#1f1208,var(--card))}
.card.green{border-color:var(--green);background:linear-gradient(135deg,#0a1f0e,var(--card))}
.card.blue{border-color:var(--blue);background:linear-gradient(135deg,#0d1632,var(--card))}
.card.yellow{border-color:var(--yellow)}

.stat-big{text-align:center;padding:1.5rem 1rem}
.stat-big .num{font-size:clamp(2.2rem,5vw,3.2rem);font-weight:800;line-height:1}
.stat-big .lbl{font-size:.78rem;color:var(--text-2);text-transform:uppercase;letter-spacing:.08em;margin-top:.4rem}
.stat-big.red .num{color:var(--red)}
.stat-big.orange .num{color:var(--orange)}
.stat-big.yellow .num{color:var(--yellow)}
.stat-big.blue .num{color:var(--blue-lt)}
.stat-big.green .num{color:var(--green)}

/* ── RANKING TABLE ──── */
.rank-table{width:100%;border-collapse:collapse;font-size:.85rem}
.rank-table th{background:#1c2330;padding:.5rem .7rem;text-align:left;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}
.rank-table td{padding:.45rem .7rem;border-bottom:1px solid var(--border)}
.rank-table tr:last-child td{border-bottom:none}
.rank-table tr:hover td{background:#1c2330}
.medal{font-size:1.1rem}
.g-chip{display:inline-flex;align-items:center;background:#1c2330;border:1px solid var(--border);border-radius:20px;padding:.1rem .55rem;font-size:.72rem;font-weight:700;color:var(--text-2);white-space:nowrap}
.g1-chip{border-color:#22c55e;color:#22c55e}
.g2-chip{border-color:#3b82f6;color:#3b82f6}
.g3-chip{border-color:#a855f7;color:#a855f7}
.g4-chip{border-color:#f97316;color:#f97316}
.g5-chip{border-color:#ef4444;color:#ef4444}
.bar-wrap{display:flex;align-items:center;gap:.4rem}
.bar-bg{flex:1;background:#1c2330;border-radius:3px;height:5px;overflow:hidden;max-width:80px}
.bar-fill{height:100%;border-radius:3px}

/* ── GROUP CARDS ──── */
.gcard{border-radius:14px;border:1px solid var(--border);padding:1rem 1.2rem;background:var(--card)}
.gcard .g-label{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:.6rem}
.gcard .g-num{font-size:1.8rem;font-weight:800;line-height:1}
.gcard .g-sub{font-size:.78rem;color:var(--text-2);margin-top:.3rem}
.gcard.g1{border-color:#22c55e} .gcard.g1 .g-num{color:#22c55e} .gcard.g1 .g-label{color:#22c55e}
.gcard.g2{border-color:#3b82f6} .gcard.g2 .g-num{color:#3b82f6} .gcard.g2 .g-label{color:#3b82f6}
.gcard.g3{border-color:#a855f7} .gcard.g3 .g-num{color:#a855f7} .gcard.g3 .g-label{color:#a855f7}
.gcard.g4{border-color:#f97316} .gcard.g4 .g-num{color:#f97316} .gcard.g4 .g-label{color:#f97316}
.gcard.g5{border-color:#ef4444} .gcard.g5 .g-num{color:#ef4444} .gcard.g5 .g-label{color:#ef4444}

.pill{display:inline-block;padding:.2rem .7rem;border-radius:20px;font-size:.75rem;font-weight:700}
.pill-red{background:#fee2e2;color:#991b1b}
.pill-green{background:#dcfce7;color:#14532d}
.pill-orange{background:#ffedd5;color:#7c2d12}

.section-label{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);font-weight:600;margin-bottom:.8rem}

/* ── AUTH ──── */
#auth-overlay{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center}
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2.5rem;width:min(380px,92vw)}
.auth-card h2{font-size:1.3rem;font-weight:700;margin-bottom:.3rem}
.auth-card p{font-size:.85rem;color:var(--text-2);margin-bottom:1.4rem}
.fg{margin-bottom:.9rem}
.fg label{display:block;font-size:.75rem;color:var(--text-2);margin-bottom:.35rem;text-transform:uppercase;letter-spacing:.05em}
.fg input{width:100%;background:#1c2330;border:1px solid var(--border);border-radius:8px;padding:.55rem .85rem;color:var(--text);font-size:.95rem;outline:none;transition:border-color .2s;font-family:inherit}
.fg input:focus{border-color:var(--red)}
.btn-auth{width:100%;background:var(--red);color:#fff;border:none;border-radius:8px;padding:.7rem;font-size:.95rem;font-weight:700;cursor:pointer;transition:background .2s;font-family:inherit}
.btn-auth:hover{background:#dc2626}
.auth-err{color:var(--red);font-size:.82rem;margin-top:.7rem;text-align:center;min-height:1.1em}

#loading{display:none;position:fixed;inset:0;background:var(--bg)cc;z-index:998;align-items:center;justify-content:center;flex-direction:column;gap:1rem}
.spinner{width:42px;height:42px;border:3px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

function norm(s){
  return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
}

const G_COLORS = {1:'#22c55e',2:'#3b82f6',3:'#a855f7',4:'#f97316',5:'#ef4444'};
const G_LABELS = {1:'g1-chip',2:'g2-chip',3:'g3-chip',4:'g4-chip',5:'g5-chip'};

// ── AUTH ──────────────────────────────────────────────────────────────────────
document.getElementById('btn-login').addEventListener('click', doLogin);
document.getElementById('pass').addEventListener('keydown', e=>{if(e.key==='Enter')doLogin();});

async function doLogin(){
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('pass').value;
  const err=document.getElementById('auth-err');
  err.textContent='';
  if(!email||!pass){err.textContent='Completa los campos.';return;}
  document.getElementById('btn-login').disabled=true;
  document.getElementById('btn-login').textContent='Ingresando…';
  try{await signInWithEmailAndPassword(auth,email,pass);}
  catch(e){
    err.textContent='Credenciales incorrectas.';
    document.getElementById('btn-login').disabled=false;
    document.getElementById('btn-login').textContent='Ingresar';
  }
}

onAuthStateChanged(auth, user=>{
  if(user){document.getElementById('auth-overlay').style.display='none';loadData();}
});

// ── CARGA ─────────────────────────────────────────────────────────────────────
async function loadData(){
  document.getElementById('loading').style.display='flex';
  try{
    const snap=await getDocs(collection(db,'asistencia'));
    const map={};
    for(const [g,lista] of Object.entries(GRUPOS)){
      for(const st of lista){
        map[norm(st.n)]={nombre:st.n,grupo:parseInt(g),icfes:st.i,rank:st.r,
          fallasDias:new Set(),fugasDias:new Set(),retardos:0,excusas:0};
      }
    }
    snap.forEach(doc=>{
      const data=doc.data(), fecha=data.fecha||doc.id;
      (data.registros||[]).forEach(r=>{
        const k=norm(r.estudiante);
        if(!map[k])return;
        const s=map[k];
        if(r.estado==='Falla')  s.fallasDias.add(fecha);
        if(r.estado==='Fuga')   s.fugasDias.add(fecha);
        if(r.estado==='Retardo')s.retardos++;
        if(r.estado==='Excusa') s.excusas++;
      });
    });
    allData=Object.values(map).map(s=>({
      nombre:s.nombre,grupo:s.grupo,icfes:s.icfes,rank:s.rank,
      fallas:s.fallasDias.size,fugas:s.fugasDias.size,
      retardos:s.retardos,excusas:s.excusas
    }));
    document.getElementById('loading').style.display='none';
    buildSlides();
    initDeck();
  }catch(err){
    document.getElementById('loading').innerHTML=
      '<span style="color:var(--red)">Error: '+err.message+'</span>';
  }
}

// ── CONSTRUCCIÓN DE SLIDES ────────────────────────────────────────────────────
function buildSlides(){
  const deck=document.getElementById('deck');
  deck.innerHTML='';
  slides=[];

  const totalFallas  =allData.reduce((a,s)=>a+s.fallas,0);
  const totalFugas   =allData.reduce((a,s)=>a+s.fugas,0);
  const totalRetardos=allData.reduce((a,s)=>a+s.retardos,0);
  const totalExcusas =allData.reduce((a,s)=>a+s.excusas,0);
  const sinInasist   =allData.filter(s=>s.fallas===0&&s.fugas===0).length;
  const conFallas    =allData.filter(s=>s.fallas>0).length;
  const maxFalla     =allData.reduce((a,s)=>Math.max(a,s.fallas),0);
  const sorted       =[...allData].sort((a,b)=>b.fallas-a.fallas||b.fugas-a.fugas||a.nombre.localeCompare(b.nombre));
  const hoy          =new Date().toLocaleDateString('es-CO',{day:'2-digit',month:'long',year:'numeric'});

  // Estadísticas por grupo
  const gStats={};
  for(let g=1;g<=5;g++){
    const est=allData.filter(s=>s.grupo===g);
    gStats[g]={
      total:est.length,
      fallas:est.reduce((a,s)=>a+s.fallas,0),
      fugas:est.reduce((a,s)=>a+s.fugas,0),
      sinFallas:est.filter(s=>s.fallas===0).length,
      max:est.reduce((a,s)=>Math.max(a,s.fallas),0),
      prom:(est.length?est.reduce((a,s)=>a+s.fallas,0)/est.length:0).toFixed(1)
    };
  }

  // ── SLIDE 1: PORTADA ──────────────────────────────────────────────────────

    <div class="slide-inner" style="text-align:center">
      <div class="tag">Concentración Educativa del Sur de Montelibano</div>
      <div class="big-title">Reporte de<br><span class="hl">Inasistencias</span><br><span class="hl2">Grado Undécimo</span></div>
      <div class="subtitle" style="margin:0 auto">
        Análisis integral de asistencia · Simulacro ICFES 2026<br>
        <span style="font-size:.9em;color:var(--text-3)">📅 ${hoy} · 175 estudiantes · 5 grupos</span>
      </div>
    </div>
  `);

  // ── SLIDE 2: RESUMEN GLOBAL ────────────────────────────────────────────────
  addSlide(deck,`
    <div class="slide-inner">
      <div class="tag">Panorama general</div>
      <div class="big-title" style="font-size:clamp(1.6rem,3.5vw,2.4rem);margin-bottom:1.5rem">Estadísticas Globales — 175 Estudiantes</div>
      <div class="grid g3" style="margin-bottom:1rem">
        <div class="card stat-big red"><div class="num">${totalFallas}</div><div class="lbl">Total días falla</div></div>
        <div class="card stat-big orange"><div class="num">${totalFugas}</div><div class="lbl">Total fugas</div></div>
        <div class="card stat-big yellow"><div class="num">${totalRetardos}</div><div class="lbl">Total retardos</div></div>
      </div>
      <div class="grid g3">
        <div class="card stat-big blue"><div class="num">${totalExcusas}</div><div class="lbl">Excusas registradas</div></div>
        <div class="card stat-big green"><div class="num">${sinInasist}</div><div class="lbl">Sin inasistencias</div></div>
        <div class="card stat-big red"><div class="num">${conFallas}</div><div class="lbl">Con al menos 1 falla</div></div>
      </div>
    </div>
  `);

  // ── SLIDE 3: COMPARATIVA POR GRUPO ────────────────────────────────────────
  const gCardsHTML = [1,2,3,4,5].map(g=>`
    <div class="gcard g${g}">
      <div class="g-label">Grupo ${g} · ${gStats[g].total} est.</div>
      <div class="g-num">${gStats[g].fallas}</div>
      <div class="g-sub">días falla · prom ${gStats[g].prom}/est.</div>
      <div style="margin-top:.6rem;font-size:.78rem;color:var(--text-2)">
        Fugas: <strong style="color:var(--orange)">${gStats[g].fugas}</strong> &nbsp;|&nbsp;
        Sin fallas: <strong style="color:var(--green)">${gStats[g].sinFallas}</strong>
      </div>
    </div>
  `).join('');
  addSlide(deck,`
    <div class="slide-inner">
      <div class="tag">Análisis por grupo</div>
      <div class="big-title" style="font-size:clamp(1.5rem,3vw,2.1rem);margin-bottom:1.2rem">Comparativa entre Grupos</div>
      <div class="grid g5">${gCardsHTML}</div>
    </div>
  `);

  // ── SLIDE 4: TOP 10 CON MÁS FALLAS ────────────────────────────────────────
  const top10 = sorted.slice(0,10);
  const top10Rows = top10.map((s,i)=>{
    const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}.`;
    const barW  = maxFalla>0?Math.round(s.fallas/maxFalla*100):0;
    return `<tr>
      <td><span class="medal">${medal}</span></td>
      <td style="font-weight:600">${s.nombre}</td>
      <td><span class="g-chip ${G_LABELS[s.grupo]}">G${s.grupo}</span></td>
      <td>
        <div class="bar-wrap">
          <span style="color:var(--red);font-weight:700;min-width:1.5rem">${s.fallas}</span>
          <div class="bar-bg"><div class="bar-fill" style="width:${barW}%;background:var(--red)"></div></div>
        </div>
      </td>
      <td style="color:var(--orange)">${s.fugas||'–'}</td>
    </tr>`;
  }).join('');
  addSlide(deck,`
    <div class="slide-inner">
      <div class="tag">Ranking</div>
      <div class="big-title" style="font-size:clamp(1.5rem,3vw,2.1rem);margin-bottom:1.2rem">Top 10 — Mayor Inasistencia</div>
      <div style="overflow:auto;border-radius:12px;border:1px solid var(--border)">
        <table class="rank-table">
          <thead><tr><th></th><th>Estudiante</th><th>Grupo</th><th>Días Falla</th><th>Fugas</th></tr></thead>
          <tbody>${top10Rows}</tbody>
        </table>
      </div>
    </div>
  `);

  // ── SLIDE 5: TOP 11–25 ─────────────────────────────────────────────────────
  const next15 = sorted.slice(10,25);
  const next15Rows = next15.map((s,i)=>{
    const barW=maxFalla>0?Math.round(s.fallas/maxFalla*100):0;
    return `<tr>
      <td style="color:var(--text-3);font-family:monospace">${i+11}.</td>
      <td style="font-weight:500;font-size:.83rem">${s.nombre}</td>
      <td><span class="g-chip ${G_LABELS[s.grupo]}">G${s.grupo}</span></td>
      <td><div class="bar-wrap"><span style="color:var(--red);font-weight:700;min-width:1.5rem;font-size:.83rem">${s.fallas}</span>
        <div class="bar-bg"><div class="bar-fill" style="width:${barW}%;background:var(--red)"></div></div></div></td>
      <td style="color:var(--orange);font-size:.83rem">${s.fugas||'–'}</td>
    </tr>`;
  }).join('');
  addSlide(deck,`
    <div class="slide-inner">
      <div class="tag">Ranking</div>
      <div class="big-title" style="font-size:clamp(1.5rem,3vw,2.1rem);margin-bottom:1.2rem">Posiciones 11 – 25</div>
      <div style="overflow:auto;border-radius:12px;border:1px solid var(--border)">

        </table>
      </div>
    </div>
  `);

  // ── SLIDES 6–10: UNO POR GRUPO ────────────────────────────────────────────
  for(let g=1;g<=5;g++){
    const est=[...allData.filter(s=>s.grupo===g)].sort((a,b)=>b.fallas-a.fallas||b.fugas-a.fugas);
    const maxF=est.reduce((a,s)=>Math.max(a,s.fallas),1);
    const rows=est.map((s,i)=>{
      const barW=Math.round(s.fallas/maxF*100);
      return `<tr>
        <td style="color:var(--text-3);font-family:monospace;font-size:.8rem">${i+1}.</td>

        <td><div class="bar-wrap"><span style="color:${s.fallas>0?'var(--red)':'var(--green)'};font-weight:700;min-width:1.2rem;font-size:.82rem">${s.fallas}</span>

        </div></td>
        <td style="font-size:.8rem;color:var(--orange)">${s.fugas||'–'}</td>
        <td style="font-size:.8rem;color:var(--yellow)">${s.retardos||'–'}</td>
      </tr>`;
    }).join('');
    addSlide(deck,`
      <div class="slide-inner">
        <div class="tag" style="color:${G_COLORS[g]}">Grupo ${g} · ${est.length} estudiantes</div>
        <div class="big-title" style="font-size:clamp(1.4rem,2.8vw,2rem);margin-bottom:1rem">Ranking Interno — Grupo ${g}</div>
        <div style="overflow:auto;max-height:65vh;border-radius:12px;border:1px solid var(--border)">

            <thead><tr><th>#</th><th>Estudiante</th><th>ICFES</th><th>Días Falla</th><th>Fugas</th><th>Retardos</th></tr></thead>
            <tbody>${rows}</tbody>

        </div>

  }

  // ── SLIDE FINAL ────────────────────────────────────────────────────────────
  addSlide(deck,`
    <div class="slide-inner" style="text-align:center">
      <div class="tag">Fin del reporte</div>
      <div class="big-title">Resumen<br><span class="hl">Ejecutivo</span></div>

function addSlide(deck, html){
  const div=document.createElement('div');
  div.className='slide';
  div.innerHTML=`<div class="slide-inner" style="display:contents">${html}</div>`;
  // Use the inner content directly
  div.innerHTML=html;
  deck.appendChild(div);
  slides.push(div);
}

// ── DECK NAVIGATION ───────────────────────────────────────────────────────────
function initDeck(){
  const dotsEl=document.getElementById('dots');
  dotsEl.innerHTML='';
  slides.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='dot'+(i===0?' active':'');
    d.addEventListener('click',()=>goTo(i));
    dotsEl.appendChild(d);
  });
  goTo(0);
}

function goTo(n){
  slides.forEach((s,i)=>{
    s.classList.remove('active','exit');
    if(i<n) s.classList.add('exit');
  });
  slides[n].classList.add('active');
  current=n;
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===n));
  document.getElementById('progress').style.width=(((n)/(slides.length-1))*100)+'%';
  document.getElementById('counter').textContent=(n+1)+' / '+slides.length;
}

document.getElementById('next').addEventListener('click',()=>{ if(current<slides.length-1) goTo(current+1); });
document.getElementById('prev').addEventListener('click',()=>{ if(current>0) goTo(current-1); });
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ') { e.preventDefault(); if(current<slides.length-1) goTo(current+1); }
  if(e.key==='ArrowLeft')               { e.preventDefault(); if(current>0) goTo(current-1); }
});
</script>
